<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>접근 권한 · 졸업시험 문제은행</title>
  <style>
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:radial-gradient(circle at 20% 20%,#2c6588 0,#173c5b 34%,#102941 75%); color:#152b43; font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif; padding:20px; }
    .card { width:min(100%,480px); background:#fff; border-radius:18px; padding:38px; box-shadow:0 22px 65px #07172855; }
    .eyebrow { font-size:12px; font-weight:800; letter-spacing:.1em; color:#2871ab; }
    h1 { margin:7px 0 10px; font-size:27px; }
    p { color:#5c7083; line-height:1.7; margin:0 0 26px; font-size:14px; }
    label { display:block; font-size:14px; font-weight:700; margin-bottom:8px; }
    input { width:100%; border:1px solid #c5d5e3; border-radius:9px; padding:13px 14px; font:inherit; font-size:19px; letter-spacing:.13em; }
    input:focus { outline:3px solid #b5d9f3; border-color:#2871ab; }
    .password-row { position:relative; }
    .password-row input { padding-right:70px; }
    .password-row button { position:absolute; right:5px; top:5px; margin:0; width:auto; padding:9px 11px; background:#f0f5f9; color:#315c7a; border-radius:6px; font-size:12px; }
    .password-row button:hover { background:#e1edf5; }
    button { margin-top:13px; width:100%; padding:13px; color:#fff; background:#2469a3; border:0; border-radius:9px; font:inherit; font-weight:800; cursor:pointer; }
    button:hover { background:#195887; }
    button:disabled { opacity:.55; cursor:wait; }
    #error { min-height:23px; margin:12px 0 0; color:#b13333; font-size:13px; }
    .foot { border-top:1px solid #e4ebf1; padding-top:19px; margin-top:20px; color:#718294; font-size:12px; }
    @media (max-width:500px) { .card { padding:27px 22px; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">ACCESS CONTROL</div>
    <h1>접근 권한 확인</h1>
    <p>비밀번호를 입력하면 학습 공간으로 이동합니다.</p>
    <form id="login">
      <label for="password">비밀번호</label>
      <div class="password-row"><input id="password" type="password" inputmode="numeric" autocomplete="current-password" required autofocus aria-describedby="error"><button id="show-password" type="button" aria-label="비밀번호 표시">보기</button></div>
      <button id="submit" type="submit">입장하기</button>
      <div id="error" role="alert"></div>
    </form>
    <div class="foot">이 페이지는 현재 컴퓨터의 로컬 서버에서만 제공됩니다.</div>
  </main>
  <script>
    document.getElementById('show-password').addEventListener('click',()=>{const field=document.getElementById('password'),button=document.getElementById('show-password');const visible=field.type==='password';field.type=visible?'text':'password';button.textContent=visible?'숨기기':'보기';button.setAttribute('aria-label',visible?'비밀번호 숨기기':'비밀번호 표시');field.focus();});
    document.getElementById('login').addEventListener('submit',async event=>{
      event.preventDefault();
      const button=document.getElementById('submit'), error=document.getElementById('error');
      button.disabled=true; error.textContent='';
      try {
        const response=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});
        const data=await response.json();
        if(!response.ok) throw new Error(data.error||'로그인에 실패했습니다.');
        location.replace(data.role==='full'?'/':'/explanations');
      } catch(exc) { error.textContent=exc.message; button.disabled=false; }
    });
  </script>
</body>
</html>
