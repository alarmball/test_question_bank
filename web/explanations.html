<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>졸업시험 해설집</title>
  <style>
    :root { --ink:#142b43; --muted:#5e7185; --blue:#1d659d; --line:#dbe5ee; --bg:#f3f6fa; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif; }
    header { background:linear-gradient(120deg,#102941,#16466a); color:#fff; padding:22px max(24px,calc((100vw - 1260px)/2)); }
    .eyebrow { color:#99c7ec; font-size:13px; font-weight:700; letter-spacing:.08em; }
    h1 { font-size:29px; margin:4px 0 6px; }
    header p { color:#c2d4e3; font-size:14px; margin:0; }
    nav { display:flex; gap:9px; margin-top:18px; }
    nav a { text-decoration:none; color:#cde3f4; border:1px solid #6d8ba4; padding:8px 12px; border-radius:8px; font-size:14px; font-weight:700; }
    nav a.active { background:#fff; color:#102941; border-color:#fff; }
    nav a[href="/"] { display:none; }
    nav button { margin-left:auto; background:transparent; color:#cde3f4; border:1px solid #6d8ba4; padding:8px 12px; border-radius:8px; font:inherit; font-size:14px; font-weight:700; cursor:pointer; }
    .access { display:inline-block; margin-top:12px; color:#cde3f4; background:#ffffff1b; border:1px solid #ffffff33; border-radius:999px; padding:5px 10px; font-size:12px; }
    main { max-width:1260px; margin:0 auto; padding:24px; display:grid; grid-template-columns:300px minmax(0,1fr); gap:18px; align-items:start; }
    aside,.chapter { background:#fff; border:1px solid var(--line); border-radius:14px; box-shadow:0 4px 18px #173c5b0c; }
    aside { position:sticky; top:18px; overflow:hidden; }
    .aside-top { padding:18px; border-bottom:1px solid var(--line); }
    .aside-top h2 { font-size:17px; margin:0 0 12px; }
    input { font:inherit; width:100%; border:1px solid #cbd9e5; border-radius:8px; padding:10px; }
    input:focus { outline:2px solid #a9d1ef; }
    .list { max-height:70vh; overflow:auto; }
    .topic { display:block; width:100%; background:#fff; border:0; border-bottom:1px solid #edf2f6; padding:12px 16px; text-align:left; cursor:pointer; font:inherit; color:var(--ink); }
    .topic:hover,.topic.active { background:#eaf3fa; }
    .topic.active { box-shadow:inset 3px 0 var(--blue); }
    .topic strong { color:var(--blue); margin-right:8px; }
    .topic span { font-size:14px; font-weight:700; }
    .topic small { display:block; padding-left:35px; color:var(--muted); margin-top:2px; }
    .chapter { padding:30px 34px; min-height:660px; }
    .chapter-kicker { color:var(--blue); font-size:13px; font-weight:800; }
    .chapter h2 { font-size:27px; margin:6px 0 15px; }
    .lead { font-size:16px; line-height:1.8; background:#eef5fb; border-left:4px solid var(--blue); padding:16px 19px; margin:16px 0 28px; border-radius:0 9px 9px 0; }
    .item { border-top:1px solid var(--line); padding:24px 0 12px; }
    .item h3 { font-size:19px; margin:0 0 9px; }
    .meta { color:var(--muted); font-size:12px; margin:0 0 14px; }
    .label { font-size:13px; font-weight:800; color:var(--blue); margin:17px 0 6px; }
    .text { white-space:pre-wrap; line-height:1.85; margin:0; font-size:15px; max-width:78ch; }
    .answer { background:#f7fafc; border:1px solid var(--line); padding:15px 17px; border-radius:9px; }
    .pitfall { border-top:1px solid var(--line); margin-top:16px; padding-top:20px; color:#8b4e27; line-height:1.7; }
    .empty { color:var(--muted); padding:18px; }
    .toolbar { display:flex; align-items:center; justify-content:flex-end; gap:8px; margin-bottom:12px; }
    .toolbar span { margin-right:auto; color:var(--muted); font-size:13px; font-weight:700; }
    .toolbar button { border:1px solid #c4d5e3; border-radius:8px; background:#fff; font:inherit; padding:8px 12px; cursor:pointer; }
    .toolbar button:disabled { opacity:.4; cursor:not-allowed; }
    .chapter-nav { display:flex; justify-content:space-between; border-top:1px solid var(--line); padding-top:18px; margin-top:24px; }
    .chapter-nav button { border:1px solid #c4d5e3; border-radius:8px; background:#fff; font:inherit; padding:9px 13px; color:var(--blue); font-weight:700; cursor:pointer; }
    .chapter-nav button:disabled { opacity:.4; cursor:not-allowed; }
    @media (max-width:820px) { main { grid-template-columns:1fr; padding:12px; } aside { position:static; } .list { max-height:200px; } .chapter { padding:22px; } }
    @media (max-width:520px) { header { padding:20px 16px; } nav { flex-wrap:wrap; } nav button { margin-left:0; } .toolbar { flex-wrap:wrap; } .toolbar span { width:100%; } }
    @media print { header,aside,.toolbar { display:none; } body { background:#fff; } main { display:block; padding:0; } .chapter { border:0; box-shadow:none; padding:0; } .item { break-inside:avoid; } }
  </style>
</head>
<body>
  <header>
    <div class="eyebrow">STUDY COMPANION</div>
    <h1>졸업시험 해설집</h1>
    <p>주제별 핵심 개념 · 모범답안 · 풀이 과정 · 주의할 점</p>
    <nav><a href="/">문제은행</a><a class="active" href="/explanations" aria-current="page">해설집</a><button id="logout" type="button">권한 변경</button></nav>
    <span id="access" class="access"></span>
  </header>
  <main>
    <aside>
      <div class="aside-top"><h2>주제 목차</h2><input id="search" type="search" placeholder="주제·해설 검색" aria-label="해설 검색"></div>
      <div id="topics" class="list"></div>
    </aside>
    <div>
      <div class="toolbar"><span id="position">주제 불러오는 중</span><button id="previous" type="button">← 이전</button><button id="next" type="button">다음 →</button><button id="print" type="button">인쇄</button></div>
      <article id="chapter" class="chapter" aria-live="polite"><p class="empty">해설집을 불러오는 중입니다.</p></article>
    </div>
  </main>
  <script>
    const state={chapters:[],selected:null};
    const $=id=>document.getElementById(id);
    const make=(tag,className,text)=>{const x=document.createElement(tag);if(className)x.className=className;if(text!==undefined)x.textContent=text;return x;};
    function filtered(){const term=$('search').value.trim().toLocaleLowerCase();return state.chapters.filter(ch=>!term||[ch.number,ch.questions[0].topic,ch.concept,ch.a_explanation,ch.b_explanation,ch.pitfall].join(' ').toLocaleLowerCase().includes(term));}
    function renderTopics(){const list=$('topics');list.replaceChildren();const chapters=filtered();if(!chapters.length){list.append(make('p','empty','검색 결과가 없습니다.'));return;}
      for(const ch of chapters){const button=make('button','topic'+(state.selected===ch.number?' active':''));button.type='button';button.append(make('strong','',ch.number),make('span','',ch.questions[0].topic),make('small','',ch.questions[0].section));button.addEventListener('click',()=>selectChapter(ch.number));list.append(button);}}
    function selectChapter(number){const ch=state.chapters.find(x=>x.number===number);if(!ch)return;state.selected=number;history.replaceState(null,'',`/explanations?chapter=${number}`);renderTopics();const index=state.chapters.indexOf(ch);$('position').textContent=`${index+1} / ${state.chapters.length} 주제`;$('previous').disabled=index===0;$('next').disabled=index===state.chapters.length-1;
      const article=$('chapter');article.replaceChildren();article.append(make('div','chapter-kicker',`${ch.questions[0].section}  /  ${number}`),make('h2','',ch.questions[0].topic),make('p','lead',ch.concept));
      for(const q of ch.questions){const section=make('section','item');section.append(make('h3','',`${q.id} · ${q.kind} 문항`),make('p','meta',q.source),make('p','label','문제'),make('p','text',q.question),make('p','label','모범답안'),make('p','text answer',q.answer),make('p','label','풀이 설명'),make('p','text',q.id.endsWith('A')?ch.a_explanation:ch.b_explanation));article.append(section);}
      article.append(make('p','pitfall',`주의할 점: ${ch.pitfall}`));const footer=make('div','chapter-nav');const prev=make('button','', '← 이전 주제');const next=make('button','','다음 주제 →');prev.disabled=index===0;next.disabled=index===state.chapters.length-1;prev.addEventListener('click',()=>selectChapter(state.chapters[index-1].number));next.addEventListener('click',()=>selectChapter(state.chapters[index+1].number));footer.append(prev,next);article.append(footer);window.scrollTo({top:0,behavior:'smooth'});
    }
    async function start(){try{const response=await fetch('/api/explanations');if(!response.ok)throw new Error('해설 데이터를 가져오지 못했습니다.');const data=await response.json();state.chapters=data.chapters;$('access').textContent=data.role==='full'?'전체 열람 권한':'10번까지 열람 권한';if(data.role==='full')document.querySelector('nav a[href="/"]').style.display='inline-block';renderTopics();const requested=new URLSearchParams(location.search).get('chapter');selectChapter(state.chapters.some(x=>x.number===requested)?requested:state.chapters[0].number);}catch(error){$('chapter').replaceChildren(make('p','empty',error.message));}}
    $('search').addEventListener('input',renderTopics);$('print').addEventListener('click',()=>window.print());start();
    $('previous').addEventListener('click',()=>{const i=state.chapters.findIndex(x=>x.number===state.selected);if(i>0)selectChapter(state.chapters[i-1].number);});
    $('next').addEventListener('click',()=>{const i=state.chapters.findIndex(x=>x.number===state.selected);if(i<state.chapters.length-1)selectChapter(state.chapters[i+1].number);});
    $('logout').addEventListener('click',async()=>{await fetch('/api/logout',{method:'POST'});location.replace('/login');});
  </script>
</body>
</html>
